[package]
name = "goalward"
version = "0.1.1"
description = "A goal-driven desktop workbench for people and coding agents"
authors = ["Goalward"]
edition = "2021"

[lib]
name = "goalward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-os = "2.4.0"
tauri-plugin-updater = "2.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep", "NSFontManager"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
