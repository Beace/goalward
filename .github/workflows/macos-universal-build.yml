name: Build macOS universal (reusable)

on:
  workflow_call:
    inputs:
      expected_version:
        description: Version to build, without the v prefix. Empty for CI.
        required: false
        type: string
        default: ''
      source_sha:
        description: Merged main commit to package. Empty for CI.
        required: false
        type: string
        default: ''
      release_version:
        description: Version stamped into the merged source before packaging. Empty for CI.
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Persistent updater signing key; mandatory for release builds.
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Updater key password; empty for an unencrypted key.
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      DMG_PYTHON: python3
      GOALWARD_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust targets and Clippy
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: goalward-universal-rust
          cache-bin: 'false'
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release_version != '' }}

      # Stamping changes only the root package versions; resolve caches from
      # the committed dependency locks before modifying this ephemeral checkout.
      - name: Stamp the release version
        if: inputs.release_version != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'A release version requires a full merged commit SHA.' >&2
            exit 1
          fi
          python3 scripts/release.py stamp "$RELEASE_VERSION"

      - name: Check release versions
        env:
          EXPECTED_VERSION: ${{ inputs.release_version || inputs.expected_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          npm_lock = json.loads(Path('package-lock.json').read_text())
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          packages = [item for item in lock['package'] if item['name'] == 'goalward']
          version = package['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid release version: {version}')
          if len(packages) != 1 or any(value != version for value in (
              tauri['version'], cargo['package']['version'], packages[0]['version'])):
              raise SystemExit('package.json, Tauri, Cargo.toml and Cargo.lock versions differ')
          if any(value != version for value in (
              npm_lock['version'], npm_lock['packages']['']['version'])) or npm_lock['name'] != package['name']:
              raise SystemExit('package.json and package-lock.json differ')
          nonpublic = [item['resolved'] for item in npm_lock['packages'].values()
                       if 'resolved' in item and not item['resolved'].startswith('https://registry.npmjs.org/')]
          if nonpublic:
              raise SystemExit('package-lock.json contains a non-public registry URL')
          expected = os.environ['EXPECTED_VERSION']
          if expected and version != expected:
              raise SystemExit(f'Expected {expected}, found {version}')
          locked = {item['name']: item['version'] for item in lock['package']}
          api = package['dependencies']['@tauri-apps/api']
          cli = package['devDependencies']['@tauri-apps/cli']
          for name, npm_version in (('api', api), ('cli', cli)):
              if not re.fullmatch(r'\d+\.\d+\.\d+', npm_version) or npm_version.split('.')[:2] != locked['tauri'].split('.')[:2]:
                  raise SystemExit(f'Pin @tauri-apps/{name} to the Cargo.lock tauri major/minor version')
          for name in ('dialog', 'notification'):
              npm_version = package['dependencies'][f'@tauri-apps/plugin-{name}']
              if npm_version != locked[f'tauri-plugin-{name}']:
                  raise SystemExit(f'Pin @tauri-apps/plugin-{name} to the Cargo.lock plugin version')
          print(f'Building Goalward {version}')
          PY

      - name: Install JavaScript dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Check installed Tauri packages
        run: npm ls @tauri-apps/api @tauri-apps/cli @tauri-apps/plugin-dialog @tauri-apps/plugin-notification --depth=0

      - name: Build and verify universal distribution and signed updater
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            npm run mac:dist -- --updater
          else
            npm run mac:dist
          fi

      - name: Verify distribution files
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          UPDATER_REQUIRED: ${{ inputs.release_version != '' }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('package.json').read_text())['version']
          output = Path('releases') / version
          prefix = f'Goalward_{version}_macos-universal'
          expected = {f'{prefix}.dmg', f'{prefix}.zip'}
          if os.environ['UPDATER_REQUIRED'] == 'true':
              expected |= {f'{prefix}.app.tar.gz', f'{prefix}.app.tar.gz.sig', 'latest.json'}
          info = json.loads((output / 'BUILD-INFO.json').read_text())
          if info['version'] != version or info['architecture'] != 'universal':
              raise SystemExit('Build metadata does not match the requested universal version')
          expected_source = os.environ['EXPECTED_SOURCE_SHA']
          if expected_source and info.get('sourceCommit') != expected_source:
              raise SystemExit('Build metadata does not match the merged source commit')
          if sorted(info['architectures']) != ['arm64', 'x86_64']:
              raise SystemExit('Build metadata does not list both macOS architectures')
          if info['signing'] != 'ad-hoc' or info['notarized'] is not False:
              raise SystemExit('Unexpected signature or notarization status')
          if {item['file'] for item in info['artifacts']} != expected or len(info['artifacts']) != len(expected):
              raise SystemExit('Missing, duplicate, or unexpected distribution artifact in build metadata')
          for item in info['artifacts']:
              path = output / item['file']
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if digest != item['sha256'] or path.stat().st_size != item['bytes']:
                  raise SystemExit(f'Artifact failed verification: {path}')
          if not (output / '安装说明.txt').is_file():
              raise SystemExit('Installation guide is missing')
          PY
          version="$(node -p "require('./package.json').version")"
          (cd "releases/$version" && shasum -a 256 -c SHA256SUMS.txt)
          if [ "$UPDATER_REQUIRED" = 'true' ]; then
            node scripts/updater-artifacts.mjs verify "releases/$version" "$version" "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: goalward-macos-universal
          path: releases/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
