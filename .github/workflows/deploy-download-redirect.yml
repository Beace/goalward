name: Deploy download redirect Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Deploy the download redirect Worker
        working-directory: workers/download-redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "98775cbe093085ec17c5fab233cd571f"
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Warning: skipping the download redirect Worker deploy because CLOUDFLARE_API_TOKEN is not set."
            exit 0
          fi
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler" wrangler@4.151.2
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" deploy
