name: macOS universal CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test versioning, release notes, and GitHub Release state
        run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v

  build:
    uses: ./.github/workflows/macos-universal-build.yml
    permissions:
      contents: read
