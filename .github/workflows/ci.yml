name: Pull request CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test versioning, release notes, and GitHub Release state
        run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v
      - name: Test updater signatures and release manifest verification
        run: node --test scripts/test-release-updater.mjs
      - name: Test the download redirect Worker
        run: node --test workers/download-redirect/test/redirect.test.mjs

  frontend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked JavaScript dependencies from the public registry
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: TypeScript type check and build
        run: npm run build
      - name: Biome lint check
        run: npm run lint
      - name: Run frontend unit tests
        run: npm test

  rust-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: goalward-ci-rust
          cache-bin: 'false'
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Clippy lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
