name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Goalward Version
      description: Which version of Goalward are you using?
      options:
        - Latest prerelease
        - v0.5.1
        - v0.5.0
        - v0.4.1
        - v0.4.0
        - v0.3.0
        - v0.2.0
        - Other (please specify below)
    validations:
      required: true

  - type: input
    id: version_other
    attributes:
      label: Other Version
      description: If you selected "Other" above, please specify the version.

  - type: dropdown
    id: macos_version
    attributes:
      label: macOS Version
      options:
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - Other
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac Chip
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
    validations:
      required: true

  - type: checkboxes
    id: runtime
    attributes:
      label: Agent Runtimes Involved
      description: Which agent runtimes are involved in this issue? (select all that apply)
      options:
        - label: Codex
        - label: Claude Code
        - label: Kimi CLI
        - label: Pi
        - label: DeepSeek Harness
        - label: Custom CLI runtime
        - label: None / Not applicable

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Add any error messages, logs, or screenshots that help explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem.
